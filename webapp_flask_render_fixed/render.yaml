services:
  - type: web
    name: biochemical-training-exam
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    numInstances: 1
    disk:
      name: materials-data
      mountPath: /var/data
      sizeGB: 10
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: biochemical-training-db
          property: connectionString
      - key: ADMIN_KEY
        sync: false
      - key: MATERIAL_STORAGE
        value: /var/data/materials

databases:
  - name: biochemical-training-db
    databaseName: biochemical_training
    plan: 0.1c-256mb
    region: singapore
